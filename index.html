<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>WPC Cricket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f0f0;color:#222;font-size:14px}

/* ── Header ── */
.hdr{background:#1a5e36;color:#fff;display:flex;align-items:center;padding:0 14px;height:52px;position:sticky;top:0;z-index:100;gap:12px}
.hdr-back{font-size:24px;cursor:pointer;line-height:1;padding:4px 4px 4px 0}
.hdr-title{flex:1;font-size:17px;font-weight:700;text-align:center}
.hdr-drop{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:700}
.hdr-drop svg{width:18px;height:18px;fill:#fff;opacity:.85}
.hdr-share{font-size:20px;opacity:.8;cursor:pointer}

/* ── Tabs ── */
.tabs{background:#fff;display:flex;border-bottom:1px solid #e0e0e0;position:sticky;top:52px;z-index:99}
.tab{flex:1;text-align:center;padding:13px 0 11px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#999;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s}
.tab.on{color:#1a5e36;border-bottom-color:#f5a623}

/* ── List content ── */
.grade-bar{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;margin-bottom:10px}
.grade-lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.grade-name{font-size:14px;font-weight:700}
.grade-link{color:#1a5e36;font-size:13px;font-weight:700}

.round-hdr{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.round-ttl{font-size:16px;font-weight:800}
.round-dt{font-size:12px;color:#999}

.card{background:#fff;margin-bottom:1px;cursor:pointer;transition:background .1s}
.card:active{background:#f5f5f5}
.card-top{padding:10px 14px;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:10px}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:3px;letter-spacing:.3px;white-space:nowrap}
.badge-upcoming{background:#e3f2fd;color:#1565c0}
.badge-completed{background:#e8f5e9;color:#2a7d32}
.badge-live{background:#e53935;color:#fff;animation:livepulse 1.4s infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.6}}
.badge-inv-upcoming{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.badge-inv-completed{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.badge-inv-live{background:#e53935;color:#fff;animation:livepulse 1.4s infinite}
.card-time{font-size:12px;color:#666}

.card-teams{padding:10px 14px 6px}
.team-row{display:flex;align-items:center;gap:12px;padding:5px 0}
.team-logo{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;text-align:center;line-height:1.2}
.logo-sh{background:#c0392b}
.logo-wpc{background:#1a5e36}
.logo-bsk{background:#8e44ad}
.logo-wpcy{background:#d4a017}
.logo-wpa{background:#0097a7}
.logo-def{background:#555}
.team-name{flex:1;font-size:15px;font-weight:600}
.team-score{text-align:right}
.tscore{font-size:15px;font-weight:800}
.tbonus{font-size:10px;color:#888;margin-top:1px}
.card-venue{padding:6px 14px 12px;font-size:12px;color:#999;border-top:1px solid #f5f5f5}
.card-result{padding:7px 14px;font-size:12px;font-weight:700;color:#2a7d32;background:#f0fff4;border-top:1px solid #e0f0e0}

/* ── Match banner ── */
.banner{background:#1a5e36;color:#fff;padding:14px 16px 18px;text-align:center}
.banner-venue{font-size:11px;opacity:.75;margin-bottom:14px;letter-spacing:.3px}
.banner-teams{display:flex;justify-content:center;align-items:center;gap:18px}
.banner-team{display:flex;flex-direction:column;align-items:center;gap:8px}
.banner-logo{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.3)}
.banner-name{font-size:11px;font-weight:800;letter-spacing:.5px;text-align:center;max-width:90px;line-height:1.3;opacity:.95}
.banner-vs{font-size:13px;opacity:.5;padding:0 4px}
.banner-team-btn{cursor:pointer;border-radius:8px;padding:4px;margin:-4px;transition:background .15s}
.banner-team-btn:active{background:rgba(255,255,255,.15)}
.banner-logo-active{border-color:#f5a623;border-width:3px;box-shadow:0 0 0 2px rgba(245,166,35,.4)}
.banner-name-active{opacity:1;font-weight:800}
.banner-inn-dot{width:6px;height:6px;border-radius:50%;background:#f5a623;margin:5px auto 0}
.banner-status{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.banner-result{font-size:13px;font-weight:700;opacity:.95}

/* ── Innings toggle ── */
.inn-toggle{background:#fff;padding:12px 16px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}
.inn-toggle-lbl{font-size:11px;color:#999;font-weight:700;letter-spacing:.4px;margin-right:4px}
.inn-btn{width:38px;height:38px;border-radius:50%;border:2px solid #1a5e36;font-size:15px;font-weight:800;cursor:pointer;background:#fff;color:#1a5e36;display:flex;align-items:center;justify-content:center;transition:all .15s}
.inn-btn.on{background:#1a5e36;color:#fff}

/* ── Scorecard ── */
.sc-block{background:#fff;margin-bottom:1px}
.sc-hdr{background:#1a5e36;color:#fff;padding:10px 16px;font-size:12px;font-weight:800;letter-spacing:.5px}
.sc-tbl{width:100%;border-collapse:collapse}
.sc-tbl th{padding:7px 4px;text-align:right;color:#999;font-size:10px;font-weight:700;letter-spacing:.3px;border-bottom:1px solid #f0f0f0}
.sc-tbl th:first-child{text-align:left;padding-left:14px}
.sc-tbl th:last-child{padding-right:14px}
.sc-tbl td{padding:10px 4px;border-bottom:1px solid #f5f5f5;vertical-align:top}
.sc-tbl td:first-child{padding-left:14px}
.sc-tbl td:last-child{padding-right:14px;text-align:right}
.bat-name{font-weight:700;font-size:14px}
.bat-dis{font-size:11px;color:#888;margin-top:2px}
.num{text-align:right;font-size:13px}
.num-bold{text-align:right;font-size:14px;font-weight:800}
.sc-extras{padding:10px 14px;font-size:12px;color:#666;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between}
.sc-total{padding:12px 14px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;border-bottom:2px solid #ddd}
.sc-bonus{padding:9px 14px;font-size:12px;color:#1a7a3c;background:#f0fff4;font-style:italic;border-bottom:1px solid #e0ede0}
.sc-gap{height:12px;background:#f0f0f0}

/* ── Match info (upcoming) ── */
.info-block{background:#fff;padding:0 14px}
.info-row{padding:12px 0;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border-bottom:none}
.info-lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-val{font-size:14px}
.info-val-grn{color:#1a5e36;font-weight:600}

/* ── Lineups ── */
.lineup-block{background:#fff;padding:16px}
.lineup-team-hdr{font-size:11px;font-weight:800;color:#999;letter-spacing:.5px;padding-bottom:10px;border-bottom:1px solid #eee;margin-bottom:4px}
.lineup-player{padding:11px 0;border-bottom:1px solid #f5f5f5;font-size:14px;display:flex;gap:10px}
.lineup-num{color:#999;font-size:12px;width:22px;flex-shrink:0;padding-top:1px}
.lineup-gap{height:20px}

/* ── Match docs ── */
.docs-block{background:#fff;padding:0}
.docs-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:#fff;border-bottom:1px solid #f0f0f0}
.docs-header-lbl{font-size:11px;font-weight:800;color:#999;letter-spacing:.5px;text-transform:uppercase}
.docs-add-btn{width:32px;height:32px;border-radius:50%;background:#1a5e36;color:#fff;font-size:22px;line-height:32px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300}
.doc-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s}
.doc-card:active{background:#f5f5f5}
.doc-icon{width:42px;height:48px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.doc-icon.pdf{background:#e53935}
.doc-icon.img{background:#1565c0}
.doc-icon.other{background:#6a1b9a}
.doc-icon-lbl{font-size:10px;font-weight:800;color:#fff;letter-spacing:.5px}
.doc-icon-lines{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.doc-icon-lines span{display:block;width:20px;height:2px;background:rgba(255,255,255,.6);border-radius:1px}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:14px;font-weight:700;margin-bottom:3px}
.doc-desc{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-arrow{color:#ccc;font-size:18px;flex-shrink:0}
.doc-del{color:#e53935;font-size:18px;padding:4px 0 4px 8px;flex-shrink:0;line-height:1}
.doc-viewer{width:100%;height:75vh;border:none;background:#f0f0f0;display:block}
.doc-img-viewer{width:100%;max-height:80vh;object-fit:contain;display:block;background:#111}
.doc-viewer-bar{background:#1a5e36;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.doc-viewer-name{font-size:13px;font-weight:700}
/* ── Add-doc modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:24px 20px 36px;display:flex;flex-direction:column;gap:14px}
.modal-title{font-size:17px;font-weight:800;margin-bottom:4px}
.modal-field label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.modal-field input,.modal-field select{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:15px;outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:#1a5e36}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.modal-btn{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.modal-btn-cancel{background:#f0f0f0;color:#333}
.modal-btn-add{background:#1a5e36;color:#fff}

/* ── Team status tab ── */
.status-block{padding:0 0 8px}
.status-section{margin:12px 16px 0;border-radius:10px;overflow:hidden;border:1px solid #e8e8e8}
.status-sec-hdr{background:#1a5e36;color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;padding:8px 14px;text-transform:uppercase}
.status-sec-hdr.amber{background:#e65100}
.status-sec-hdr.blue{background:#1565c0}
.status-player-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f0;gap:10px}
.status-player-row:last-child{border-bottom:none}
.status-pos{width:22px;height:22px;border-radius:50%;background:#f0f0f0;font-size:11px;font-weight:800;color:#666;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.status-pos.keeper{background:#1a5e36;color:#fff}
.status-pos.two-ov{background:#e65100;color:#fff}
.status-name{font-size:14px;font-weight:700;flex:1}
.status-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px}
.status-tag.keeper{background:#e8f5e9;color:#1a5e36}
.status-tag.two-ov{background:#fff3e0;color:#e65100}
.status-stat{font-size:12px;color:#666;text-align:right;line-height:1.4}
.status-stat strong{color:#222;font-weight:800}
.status-row-2col{display:flex;gap:0}
.status-col{flex:1;padding:10px 14px;border-right:1px solid #f0f0f0}
.status-col:last-child{border-right:none}
.status-col-hdr{font-size:10px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
/* ── Coming soon ── */
.coming-soon{padding:48px 20px;text-align:center;color:#bbb;font-size:14px}

/* ── Live panel in hub ── */
.live-panel{background:#0d2b1a;color:#fff;border-radius:12px;margin:12px 0;padding:16px}
.live-hdr{display:flex;align-items:center;margin-bottom:8px}
.live-score{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1}
.live-batrow{display:flex;gap:8px;margin-top:10px}
.live-bat{flex:1;background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px}
.live-bat-strike{background:rgba(245,166,35,.18);border:1px solid rgba(245,166,35,.5)}
.live-batname{font-size:14px;font-weight:800;display:block}
.live-batstat{font-size:12px;opacity:.6;display:block;margin-top:2px}
.live-bowrow{margin-top:10px;font-size:13px;font-weight:700;opacity:.85}
.live-balls{display:flex;flex-wrap:wrap;gap:5px}
.lb-dot{background:rgba(255,255,255,.15);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.lb-run{background:rgba(255,255,255,.25);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.lb-bnd{background:#1a5e36;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.lb-w{background:#e53935;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}

.pb{padding-bottom:60px}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:#1a5e36}
.loading-dot{width:10px;height:10px;border-radius:50%;background:#1a5e36;animation:ld .8s infinite alternate}
@keyframes ld{from{opacity:.2}to{opacity:1}}
</style>
</head>

  if(e.b)p.push('b '+e.b);

  if(e.nb)p.push('nb '+e.nb);
  return p.length?'('+p.join(', ')+')':'';
}

function hScorecard(inn){
  var hasRe=inn.batters.some(function(b){return b.re!=null;});
  var batRows=inn.batters.map(function(b){
    return (
      '<tr>'+
        '<td><div class="bat-name">'+b.n+'</div><div class="bat-dis">'+b.d+'</div></td>'+
        '<td class="num-bold">'+b.r+'</td>'+
        (hasRe?'<td class="num" style="color:#1a5e36;font-weight:700">'+b.re+'</td>':'')+
        '<td class="num">'+b.b+'</td>'+
        '<td class="num">'+b.fs+'</td>'+
        '<td class="num">'+b.sx+'</td>'+
        '<td class="num">'+sr(b.r,b.b)+'</td>'+
      '</tr>'
    );
  }).join('');

  var bowlRows=inn.bowlers.map(function(b){
    return (
      '<tr>'+
        '<td><div class="bat-name">'+b.n+'</div></td>'+
        '<td class="num">'+b.o+'</td>'+
        '<td class="num">'+b.r+'</td>'+
        '<td class="num-bold">'+b.w+'</td>'+
        '<td class="num">'+b.ec.toFixed(1)+'</td>'+
      '</tr>'
    );
  }).join('');

  var wktWord=inn.wkts===1?'wicket':'wickets';

  return (
    '<div class="sc-block">'+
      '<div class="sc-hdr">'+inn.bat.toUpperCase()+' &ndash; BATTING</div>'+
      '<table class="sc-tbl">'+
        '<tr><th>BATTER</th><th>R</th>'+(hasRe?'<th title="Runs scored with extras">+E</th>':'')+
        '<th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+
        batRows+
      '</table>'+
      '<div class="sc-extras"><span>Extras '+extStr(inn.extras)+'</span><span>'+inn.extras.tot+'</span></div>'+
      '<div class="sc-total"><span>Total ('+inn.wkts+' wkts, '+inn.overs+' ov)</span><span>'+inn.total+'</span></div>'+
      '<div class="sc-bonus">'+inn.bowl+' receive +'+inn.bonus+' bonus runs ('+inn.wkts+' '+wktWord+' taken)</div>'+
    '</div>'+
    '<div class="sc-gap"></div>'+
    '<div class="sc-block">'+
      '<div class="sc-hdr">'+inn.bowl.toUpperCase()+' &ndash; BOWLING</div>'+
      '<table class="sc-tbl">'+
        '<tr><th>BOWLER</th><th>O</th><th>R</th><th>W</th><th>ECON</th></tr>'+
        bowlRows+
      '</table>'+
    '</div>'
  );
}

function hLiveStatus(m){
  var liveInn=m.innings[m.innings.length-1];
  if(!liveInn)return '';
  var ss=liveInn.scorerState;
  if(!ss)return '<div class="live-panel"><div class="live-hdr"><span class="badge badge-inv-live">● LIVE</span></div><div class="live-score">'+liveInn.total+'/'+liveInn.wkts+'</div><div style="margin-top:6px;opacity:.6;font-size:13px">'+liveInn.overs+' overs</div></div>';
  var balls=ss.balls||[];
  var curOvNum=balls.length?Math.floor((balls.length-1)/6):0;
  var curOvBalls=balls.filter(function(b){return b.ov===curOvNum;});
  var last10=balls.slice(-10);
  function ballHtml(b){
    var label=b.isWkt?'W':b.type;
    var cls=b.isWkt?'lb-w':(b.type==='4'||b.type==='6')?'lb-bnd':(b.type==='.')?'lb-dot':'lb-run';
    return '<span class="'+cls+'">'+label+'</span>';
  }
  var bsOn=(ss.bs&&ss.bs[ss.batOn])||{r:0,b:0,re:0};
  var bsOff=(ss.bs&&ss.bs[ss.batOff])||{r:0,b:0,re:0};
  var bowler=ss.bowler||'–';
  var bw=(ss.bws&&ss.bws[bowler])||{r:0,balls:0,w:0};
  var bowOv=Math.floor((bw.balls||0)/6)+'.'+(bw.balls||0)%6;
  return (
    '<div class="live-panel">'+
      '<div class="live-hdr"><span class="badge badge-inv-live">● LIVE</span><span style="font-size:13px;font-weight:800;margin-left:8px">'+liveInn.bat+' batting</span></div>'+
      '<div class="live-score">'+liveInn.total+'/'+liveInn.wkts+'<span style="font-size:14px;font-weight:700;opacity:.6;margin-left:8px">'+liveInn.overs+' ov</span></div>'+
      '<div class="live-batrow">'+
        '<div class="live-bat live-bat-strike">'+
          '<span class="live-batname">'+ss.batOn+' ✱</span>'+
          '<span class="live-batstat">'+bsOn.r+' ('+bsOn.b+'b)</span>'+
        '</div>'+
        '<div class="live-bat">'+
          '<span class="live-batname">'+ss.batOff+'</span>'+
          '<span class="live-batstat">'+bsOff.r+' ('+bsOff.b+'b)</span>'+
        '</div>'+
      '</div>'+
      '<div class="live-bowrow">⬤ '+bowler+' &nbsp;'+bowOv+' ov &bull; '+bw.r+'r &bull; '+bw.w+'w</div>'+
      '<div style="margin-top:10px">'+
        '<div style="font-size:11px;opacity:.5;font-weight:800;letter-spacing:.5px;margin-bottom:6px">THIS OVER</div>'+
        '<div class="live-balls">'+(curOvBalls.length?curOvBalls.map(ballHtml).join(''):'<span style="opacity:.3;font-size:13px">· · · · · ·</span>')+'</div>'+
      '</div>'+
      '<div style="margin-top:10px">'+
        '<div style="font-size:11px;opacity:.5;font-weight:800;letter-spacing:.5px;margin-bottom:6px">LAST 10 BALLS</div>'+
        '<div class="live-balls">'+(last10.length?last10.map(ballHtml).join(''):'<span style="opacity:.3;font-size:13px">No balls yet</span>')+'</div>'+
      '</div>'+
    '</div>'
  );
}

function docIconCls(type){
  var t=(type||'').toUpperCase();
  if(t==='PDF')return 'pdf';
  if(t==='IMG'||t==='IMAGE'||t==='JPG'||t==='PNG')return 'img';
  return 'other';
}

function docCard(d){
  var isOpen=S.docFile===d.file;
  var iconCls=docIconCls(d.type);
  var isImg=(iconCls==='img');
  return (
    '<div class="doc-card" onclick="toggleDoc(\''+d.file+'\')">'+
      '<div class="doc-icon '+iconCls+'">'+
        '<div class="doc-icon-lbl">'+d.type+'</div>'+
        '<div class="doc-icon-lines"><span></span><span></span><span></span></div>'+
      '</div>'+
      '<div class="doc-info">'+
        '<div class="doc-name">'+d.name+'</div>'+
        '<div class="doc-desc">'+d.desc+'</div>'+
      '</div>'+
      (d.id?'<span class="doc-del" onclick="event.stopPropagation();deleteDoc('+d.id+')">&#10005;</span>':'')+
      '<span class="doc-arrow">'+(isOpen?'&#8964;':'&#8250;')+'</span>'+

    (isOpen?

          '<span class="doc-viewer-name">'+d.name+'</span>'+

function orderRows(order, keepers, twoOverBowler){
  return order.map(function(name,i){
    var isKeeper=keepers?(keepers.indexOf(name)>=0):false;
    var isTwoOv=twoOverBowler?(name===twoOverBowler):false;
    var keeperOvs=(keepers&&keepers[0]===name)?'WK 1-10':'WK 11-20';
    return (
      '<div class="status-player-row">'+
        '<div class="status-pos'+(isKeeper?' keeper':'')+(isTwoOv?' two-ov':'')+'">'+( i+1)+'</div>'+
        '<div class="status-name">'+name+
          (isKeeper?'<span class="status-tag keeper">'+keeperOvs+'</span>':'')+
          (isTwoOv?'<span class="status-tag two-ov">2 overs</span>':'')+
        '</div>'+
      '</div>'
    );
  }).join('');
}

function hDocs(m){
  var allDocs=m.docs||[];

    modal=(
      '<div class="modal-overlay" onclick="closeAddDoc()">'+
        '<div class="modal-sheet" onclick="event.stopPropagation()">'+

          '<div class="modal-field"><label>Name</label><input id="adn" placeholder="e.g. Team Photo"></div>'+
          '<div class="modal-field"><label>Description</label><input id="add" placeholder="Short description"></div>'+

              '<option value="IMG">Image</option>'+
              '<option value="DOC">Document</option>'+

          '</div>'+
          '<div class="modal-btns">'+
            '<button class="modal-btn modal-btn-cancel" onclick="closeAddDoc()">Cancel</button>'+

        '</div>'+

  // ── Order blocks (only when teamStatus exists) ──
  var orderHtml='';
  if(m.teamStatus){
    var ts=m.teamStatus, ng=ts.nextGame;
    orderHtml=(
      '<div class="status-section" style="margin:12px 16px 0">'+
        '<div class="status-sec-hdr">This Match &mdash; Batting Order</div>'+
        orderRows(ts.battingOrder, ts.keepers, null)+
      '</div>'+
      '<div class="status-section" style="margin:8px 16px 0">'+
        '<div class="status-sec-hdr">This Match &mdash; Bowling Order</div>'+
        orderRows(ts.bowlingCycle, null, ts.twoOverBowler)+
      '</div>'+
      '<div class="status-section" style="margin:8px 16px 0">'+
        '<div class="status-sec-hdr amber">Next Match &mdash; Batting Order</div>'+
        orderRows(ng.battingOrder, ng.keepers, null)+
      '</div>'+
      '<div class="status-section" style="margin:8px 16px 12px">'+
        '<div class="status-sec-hdr blue">Next Match &mdash; Bowling Order</div>'+
        orderRows(ng.bowlingCycle, null, ng.twoOverBowler)+
      '</div>'
    );
  }
  return (
    '<div class="docs-block">'+
      '<div class="docs-header">'+
        '<div class="docs-header-lbl">Documents</div>'+
        '<div class="docs-add-btn" onclick="showAddDoc()">+</div>'+

      (allEmpty?'<div class="coming-soon">No documents yet — tap + to add one</div>':cards)+

function toggleDoc(file){
  S.docFile=(S.docFile===file?null:file);
  render();
}
function showAddDoc(){S.showAddDoc=true;render();}
function closeAddDoc(){S.showAddDoc=false;render();}
function saveDoc(mid){
  var n=(document.getElementById('adn')||{}).value||'';
  var d=(document.getElementById('add')||{}).value||'';
  var f=(document.getElementById('adf')||{}).value||'';
  var t=(document.getElementById('adt')||{}).value||'PDF';
  if(!n||!f){alert('Name and URL/filename are required');return;}
  S.showAddDoc=false;
  render();
  db.from('match_docs').insert({match_id:mid,name:n,description:d,file_url:f,type:t})
    .then(function(res){if(res.error)console.error('saveDoc error',res.error);else loadData();});
}
function deleteDoc(docId){
  db.from('match_docs').delete().eq('id',docId)
    .then(function(res){if(res.error)console.error('deleteDoc error',res.error);else loadData();});
}

function hLineups(m){
  if(!m.innings.length){
    return '<div class="coming-soon">Lineups not yet available</div>';
  }
  var i0=m.innings[0], i1=m.innings[1];
  // t1 bats in innings 0, t2 bats in innings 1
  var t1players=i0.batters.map(function(b,i){
    return '<div class="lineup-player"><span class="lineup-num">'+(i+1)+'</span><span>'+b.n+'</span></div>';
  }).join('');
  var t2players=i1.batters.map(function(b,i){
    return '<div class="lineup-player"><span class="lineup-num">'+(i+1)+'</span><span>'+b.n+'</span></div>';
  }).join('');
  return (
    '<div class="lineup-block">'+
      '<div class="lineup-team-hdr">'+m.t1.name.toUpperCase()+'</div>'+
      t1players+
      '<div class="lineup-gap"></div>'+
      '<div class="lineup-team-hdr">'+m.t2.name.toUpperCase()+'</div>'+
      t2players+
    '</div>'
  );
}

function hStandings(){
  var rec={p:0,w:0,l:0,rs:0,ra:0,wt:0,wl:0};
  M.forEach(function(m){
    if(m.status!=='completed') return;
    var tealBat=null, tealBowl=null;
    m.innings.forEach(function(inn){
      if(inn.bat==='WPC Teal') tealBat=inn;
      if(inn.bowl==='WPC Teal') tealBowl=inn;
    });
    if(!tealBat||!tealBowl) return;
    rec.p++;
    rec.rs+=tealBat.total;
    rec.ra+=tealBowl.total;
    rec.wt+=tealBowl.wkts||0;
    rec.wl+=tealBat.wkts||0;
    var tealScore=tealBat.total+(tealBowl.bonus||0);
    var oppScore=tealBowl.total+(tealBat.bonus||0);
    if(tealScore>oppScore) rec.w++; else rec.l++;
  });
  var rows='';
  M.forEach(function(m){
    if(m.status!=='completed') return;
    var tealBat=null, tealBowl=null;
    m.innings.forEach(function(inn){
      if(inn.bat==='WPC Teal') tealBat=inn;
      if(inn.bowl==='WPC Teal') tealBowl=inn;
    });
    if(!tealBat||!tealBowl) return;
    var won=(tealBat.total+(tealBowl.bonus||0))>(tealBowl.total+(tealBat.bonus||0));
    var opp=m.t1.name==='WPC Teal'?m.t2.name:m.t1.name;
    rows+='<tr>'+
      '<td style="text-align:left;padding:7px 10px 7px 0">Rd '+m.round+' vs '+opp+'</td>'+
      '<td class="num" style="color:'+(won?'#1a5e36':'#c0392b')+'">'+tealBat.total+'</td>'+
      '<td class="num">'+tealBowl.wkts+'</td>'+
    '</tr>';
  });
  return '<div class="sc-block">'+
    '<div class="sc-title">WPC Teal — Season Record</div>'+
    '<table class="sc-tbl" style="width:100%">'+
      '<thead><tr>'+
        '<th style="text-align:left">Match</th>'+
        '<th>RS</th>'+
        '<th>WT</th>'+
      '</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
      '<tfoot><tr style="border-top:2px solid #ddd">'+
        '<td style="text-align:left;padding:8px 10px 6px 0;font-weight:700">Total ('+rec.p+' game'+(rec.p!==1?'s':'')+', '+rec.w+'W '+rec.l+'L)</td>'+
        '<td class="num" style="font-weight:700;color:#1a5e36">'+rec.rs+'</td>'+
        '<td class="num" style="font-weight:700">'+rec.wt+'</td>'+
      '</tr></tfoot>'+
    '</table>'+
  '</div>';
}

function hSeasonStats(){
  var batAgg={}, bowlAgg={};
  M.forEach(function(m){
    if(m.status!=='completed') return;
    m.innings.forEach(function(inn){
      if(inn.bat==='WPC Teal'){
        (inn.batters||[]).forEach(function(b){
          if(!batAgg[b.n]) batAgg[b.n]={n:b.n,r:0,re:null,b:0,fs:0,sx:0};
          batAgg[b.n].r+=b.r||0;
          if(b.re!=null){batAgg[b.n].re=(batAgg[b.n].re||0)+b.re;}
          batAgg[b.n].b+=b.b||0;
          batAgg[b.n].fs+=b.fs||0;
          batAgg[b.n].sx+=b.sx||0;
        });
      }
      if(inn.bowl==='WPC Teal'){
        (inn.bowlers||[]).forEach(function(b){
          if(!bowlAgg[b.n]) bowlAgg[b.n]={n:b.n,o:0,r:0,w:0};
          bowlAgg[b.n].o+=parseFloat(b.o)||0;
          bowlAgg[b.n].r+=b.r||0;
          bowlAgg[b.n].w+=b.w||0;
        });
      }
    });
  });
  // Two separate sorted lists for the two scoring methods
  var batByR=Object.values(batAgg).sort(function(a,b){return b.r-a.r;});
  var batByRe=Object.values(batAgg).filter(function(b){return b.re!=null;}).sort(function(a,b){return b.re-a.re;});
  var batRowsR=batByR.map(function(b){
    var sr=b.b?(b.r/b.b*100).toFixed(1):'0.0';
    return '<tr>'+
      '<td><div class="bat-name">'+b.n+'</div></td>'+
      '<td class="num-bold">'+b.r+'</td>'+
      '<td class="num">'+b.b+'</td>'+
      '<td class="num">'+b.fs+'</td>'+
      '<td class="num">'+b.sx+'</td>'+
      '<td class="num">'+sr+'</td>'+
    '</tr>';
  }).join('');
  var batRowsRe=batByRe.map(function(b){
    var sr=b.b?(b.re/b.b*100).toFixed(1):'0.0';
    return '<tr>'+
      '<td><div class="bat-name">'+b.n+'</div></td>'+
      '<td class="num-bold" style="color:#1a5e36">'+b.re+'</td>'+
      '<td class="num">'+b.b+'</td>'+
      '<td class="num">'+b.fs+'</td>'+
      '<td class="num">'+b.sx+'</td>'+
      '<td class="num">'+sr+'</td>'+
    '</tr>';
  }).join('');
  var bowlers=Object.values(bowlAgg).sort(function(a,b){
    if(b.w!==a.w) return b.w-a.w;
    var eA=a.o?a.r/a.o:99, eB=b.o?b.r/b.o:99;
    return eA-eB;
  });
  var bowlRows=bowlers.map(function(b){
    var ec=b.o?(b.r/b.o).toFixed(1):'-';
    return '<tr>'+
      '<td><div class="bat-name">'+b.n+'</div></td>'+
      '<td class="num">'+b.o+'</td>'+
      '<td class="num">'+b.r+'</td>'+
      '<td class="num-bold">'+b.w+'</td>'+
      '<td class="num">'+ec+'</td>'+
    '</tr>';
  }).join('');
  return (
    '<div class="status-block">'+
      '<div class="sc-block" style="margin:12px 0 1px">'+
        '<div class="sc-hdr">WPC TEAL &ndash; RUNS OFF BAT</div>'+
        '<table class="sc-tbl">'+
          '<tr><th>BATTER</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+
          batRowsR+
        '</table>'+
      '</div>'+
      (batRowsRe?
        '<div class="sc-block" style="margin:1px 0 1px">'+
          '<div class="sc-hdr">WPC TEAL &ndash; RUNS SCORED IN TOTAL</div>'+
          '<table class="sc-tbl">'+
            '<tr><th>BATTER</th><th>+E</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+
            batRowsRe+
          '</table>'+
        '</div>'
      :'')+
      '<div class="sc-block" style="margin:1px 0 12px">'+
        '<div class="sc-hdr">WPC TEAL &ndash; BOWLING STATS</div>'+
        '<table class="sc-tbl">'+
          '<tr><th>BOWLER</th><th>O</th><th>R</th><th>W</th><th>ECON</th></tr>'+
          bowlRows+
        '</table>'+
      '</div>'+
    '</div>'
  );
}

function hStatus(m){
  if(!m.teamStatus){return '<div class="coming-soon">No status data for this match</div>';}
  var ts=m.teamStatus;
  var batMap={}, bowlMap={};
  m.innings.forEach(function(inn){
    if(inn.bat===ts.team) inn.batters.forEach(function(b){batMap[b.n]=b;});
    if(inn.bowl===ts.team) inn.bowlers.forEach(function(b){bowlMap[b.n]=b;});
  });
  // ── BATTING STATS (sorted) ──
  var sortedBat=ts.battingOrder.slice().map(function(name){
    return batMap[name]||{n:name,r:0,b:0,fs:0,sx:0,d:'-'};
  }).sort(function(a,b){
    if(b.r!==a.r)return b.r-a.r;
    var srA=a.b?(a.r/a.b*100):0, srB=b.b?(b.r/b.b*100):0;
    if(Math.abs(srB-srA)>0.01)return srB-srA;
    if(b.fs!==a.fs)return b.fs-a.fs;
    return b.sx-a.sx;
  });
  var hasReStat=sortedBat.some(function(b){return b.re!=null;});
  var batRows=sortedBat.map(function(b){
    var sr=b.b?(b.r/b.b*100).toFixed(1):'0.0';
    return '<tr>'+
      '<td><div class="bat-name">'+b.n+'</div><div class="bat-dis">'+(b.d||'-')+'</div></td>'+
      '<td class="num-bold">'+b.r+'</td>'+
      (hasReStat?'<td class="num" style="color:#1a5e36;font-weight:700">'+(b.re!=null?b.re:'-')+'</td>':'')+
      '<td class="num">'+b.b+'</td>'+
      '<td class="num">'+(b.fs||0)+'</td>'+
      '<td class="num">'+(b.sx||0)+'</td>'+
      '<td class="num">'+sr+'</td>'+
    '</tr>';
  }).join('');
  // ── BOWLING STATS (sorted by wickets desc, then economy asc) ──
  var sortedBowl=ts.battingOrder.slice().filter(function(name){return !!bowlMap[name];})
    .map(function(name){return bowlMap[name];})
    .sort(function(a,b){
      if(b.w!==a.w)return b.w-a.w;
      return a.ec-b.ec;
    });
  var bowlRows=sortedBowl.map(function(b){
    return '<tr>'+
      '<td><div class="bat-name">'+b.n+'</div></td>'+
      '<td class="num">'+b.o+'</td>'+
      '<td class="num">'+b.r+'</td>'+
      '<td class="num-bold">'+b.w+'</td>'+
      '<td class="num">'+b.ec+'</td>'+
    '</tr>';
  }).join('');
  return (
    '<div class="status-block">'+
      // Batting stats collapsible
      '<div class="sc-block" style="margin:12px 0 1px">'+
        '<div class="sc-hdr" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleStatSec(\'bat\')">'+
          '<span>'+ts.team.toUpperCase()+' &ndash; BATTING STATS</span>'+
          '<span style="font-size:16px;font-weight:400">'+(S.statBat?'&#8964;':'&#8250;')+'</span>'+
        '</div>'+
        (S.statBat?
          '<table class="sc-tbl">'+
            '<tr><th>BATTER</th><th>R</th>'+(hasReStat?'<th title="Runs scored with extras">+E</th>':'')+
            '<th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+
            batRows+
          '</table>'
        :'')+
      '</div>'+
      // Bowling stats collapsible
      '<div class="sc-block" style="margin:1px 0 12px">'+
        '<div class="sc-hdr" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleStatSec(\'bowl\')">'+
          '<span>'+ts.team.toUpperCase()+' &ndash; BOWLING STATS</span>'+
          '<span style="font-size:16px;font-weight:400">'+(S.statBowl?'&#8964;':'&#8250;')+'</span>'+
        '</div>'+
        (S.statBowl?
          '<table class="sc-tbl">'+
            '<tr><th>BOWLER</th><th>O</th><th>R</th><th>W</th><th>ECON</th></tr>'+
            bowlRows+
          '</table>'
        :'')+
      '</div>'+
    '</div>'
  );
}
function toggleStatSec(s){if(s==='bat')S.statBat=!S.statBat;else S.statBowl=!S.statBowl;render();}

// ── actions ──
function openM(id){S.view='match';S.mid=id;S.tab='summary';S.inn=0;S.docFile=null;render();scrollTo(0,0);}
function goBack(){S.view='list';S.mid=null;S.docFile=null;render();scrollTo(0,0);}
function setTab(t){S.tab=t;S.docFile=null;render();}
function setListTab(t){S.listTab=t;render();scrollTo(0,0);}
function setInn(i){S.inn=i;render();}

function saveNav(){
  try{sessionStorage.setItem('wpc-nav',JSON.stringify({view:S.view,mid:S.mid,tab:S.tab,inn:S.inn}));}catch(e){}
}
function render(){
  saveNav();
  var app=document.getElementById('app');
  app.innerHTML=S.view==='list'?hList():hDetail(S.mid);
}
// ── loadData: fetch from Supabase, assemble M, then render ──
function loadData(){
  Promise.all([
    db.from('matches').select('*').order('id'),
    db.from('innings').select('*').order('match_id').order('innings_num'),
    db.from('match_docs').select('*').order('created_at')
  ]).then(function(results){
    var mRes=results[0], iRes=results[1], dRes=results[2];
    if(mRes.error||iRes.error||dRes.error){
      console.error('loadData error',mRes.error||iRes.error||dRes.error);
      render(); return;
    }
    var rows=mRes.data, inns=iRes.data, docs=dRes.data;
    if(!rows||!rows.length){render();return;}
    M=rows.map(function(r){
      return {
        id:r.id, round:r.round, date:r.date, time:r.time, datetime:r.datetime,
        venue:r.venue, grade:r.grade, status:r.status,
        t1:r.t1, t2:r.t2, result:r.result,
        teamStatus:r.team_status,
        innings:(inns||[]).filter(function(i){return i.match_id===r.id;}).map(function(i){
          return {bat:i.bat,bowl:i.bowl,total:i.total,wkts:i.wkts,overs:i.overs,
                  extras:i.extras,bonus:i.bonus,
                  batters:i.batters||[],bowlers:i.bowlers||[],
                  scorerState:i.scorer_state};
        }),
        docs:(docs||[]).filter(function(d){return d.match_id===r.id;}).map(function(d){
          return {id:d.id,name:d.name,desc:d.description,file:d.file_url,type:d.type};
        })
      };
    });
    render();
  }).catch(function(err){console.error('loadData exception',err);render();});
}

// ── Real-time subscription ──
db.channel('wpc-changes')
  .on('postgres_changes',{event:'*',schema:'public',table:'matches'},function(){loadData();})
  .on('postgres_changes',{event:'*',schema:'public',table:'innings'},function(){loadData();})
  .on('postgres_changes',{event:'*',schema:'public',table:'match_docs'},function(){loadData();})
  .subscribe();

// restore navigation state on reload
try{
  var _nav=JSON.parse(sessionStorage.getItem('wpc-nav')||'null');
  if(_nav&&_nav.view){S.view=_nav.view;S.mid=_nav.mid||null;S.tab=_nav.tab||'summary';S.inn=_nav.inn||0;}
}catch(e){}
loadData();
</script>
