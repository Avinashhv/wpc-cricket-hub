<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WPC Scorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d2b1a;color:#fff;min-height:100vh}
.hdr{background:#1a5e36;padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.hdr-back{font-size:22px;cursor:pointer;padding:4px 8px 4px 0}
.hdr-title{font-size:16px;font-weight:800;flex:1}
.hdr-save{font-size:11px;opacity:.6}
.hdr-hub{font-size:11px;font-weight:800;background:#f5a623;color:#1a5e36;padding:5px 10px;border-radius:14px;text-decoration:none;letter-spacing:.3px;white-space:nowrap}
.scr{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:30px}

/* PIN */
.pin-wrap{min-height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
.pin-dots{display:flex;gap:16px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.pin-dot.on{background:#f5a623;border-color:#f5a623}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:260px}
.pk{height:70px;border-radius:14px;background:rgba(255,255,255,.13);border:none;color:#fff;font-size:26px;font-weight:700;cursor:pointer}
.pk:active{background:rgba(255,255,255,.28)}

/* General */
.lbl{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin-bottom:5px}
.inp{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 13px;color:#fff;font-size:15px;outline:none;font-family:inherit;resize:none}
select.inp{background:#1a4a2a;color:#fff}
select.inp option{background:#1a4a2a;color:#fff}
.inp::placeholder{opacity:.35}
.inp:focus{border-color:rgba(255,255,255,.5)}
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer}
.btn:active{opacity:.8}
.btn-gold{background:#f5a623;color:#0d2b1a}
.btn-dim{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.card{background:rgba(255,255,255,.08);border-radius:12px;padding:14px;cursor:pointer;transition:background .1s}
.card:active{background:rgba(255,255,255,.18)}

/* Team pick */
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpick-btn{padding:18px 10px;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid transparent;color:#fff;font-size:14px;font-weight:700;text-align:center;cursor:pointer}
.tpick-btn.on{background:#f5a623;color:#0d2b1a;border-color:#f5a623}

/* Score banner */
.sbanner{background:#1a5e36;border-radius:12px;padding:16px;text-align:center}
.stotal{font-size:42px;font-weight:900;letter-spacing:1px;line-height:1}
.sover{font-size:13px;opacity:.75;margin-top:6px}
.starget{font-size:13px;color:#f5a623;margin-top:4px;font-weight:700}

/* Batsmen */
.batrow{background:rgba(255,255,255,.07);border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bat{text-align:center;flex:1}
.bat-name{font-size:14px;font-weight:700}
.bat-stat{font-size:11px;opacity:.65;margin-top:2px}
.bat-strike .bat-name::after{content:'*';color:#f5a623;margin-left:3px}
.swap-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 11px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}

/* Bowler */
.bowrow{background:rgba(255,255,255,.05);border-radius:8px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
.bow-name{font-size:13px;font-weight:700}
.bow-stat{font-size:12px;opacity:.6}

/* Over dots */
.over-dots{display:flex;gap:6px;justify-content:center;min-height:26px;align-items:center;flex-wrap:wrap}
.od{font-size:13px;font-weight:700;padding:3px 5px;border-radius:4px;background:rgba(255,255,255,.08);min-width:22px;text-align:center}
.od-wkt{color:#ff6b6b}
.od-extra{color:#f5a623}

/* Ball buttons */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bb{height:58px;border-radius:12px;border:none;font-size:16px;font-weight:800;cursor:pointer;color:#fff;transition:transform .1s}
.bb:active{transform:scale(.94)}
.bb-dot{background:#2a6e45}
.bb-run{background:#1f5e38}
.bb-4{background:#1a7a40}
.bb-6{background:#155c30}
.bb-wide{background:#7a3500}
.bb-bye{background:#1a3a7a}
.bb-nb{background:#444}
.bb-wkt{background:#7a0000;grid-column:span 2}
.bb-undo{background:rgba(255,255,255,.1);grid-column:span 2}
.bb-swap{background:rgba(255,255,255,.08);grid-column:span 2;font-size:13px}

/* Retire banner */
.retire-bar{background:#f5a623;color:#0d2b1a;border-radius:10px;padding:13px 16px;text-align:center;font-weight:800;font-size:14px;cursor:pointer}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end}
.mbox{background:#1a3d2a;border-radius:16px 16px 0 0;width:100%;padding:22px 18px 38px;display:flex;flex-direction:column;gap:12px}
.mbox-title{font-size:17px;font-weight:800;text-align:center;margin-bottom:2px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mopt{padding:12px 6px;background:rgba(255,255,255,.1);border-radius:8px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.mopt:active,.mopt.on{background:#f5a623;color:#0d2b1a}
.mrow4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbtns{display:flex;gap:10px}
.mbtn{flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:800;cursor:pointer}
.mbtn-ok{background:#f5a623;color:#0d2b1a}
.mbtn-no{background:rgba(255,255,255,.1);color:#fff}

/* Bowler picker */
.bow-opt{padding:14px;background:rgba(255,255,255,.08);border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bow-opt:active{background:rgba(255,255,255,.2)}
.bow-opt.dis{opacity:.3;pointer-events:none}

/* Summary */
.sum-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.sum-row:last-child{border:none}

.badge-live{background:#e53935;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:3px;letter-spacing:.3px;display:inline-block}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:#f5a623;color:#0d2b1a;font-size:30px;font-weight:300;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.92)}
</style>
</head>
<body>
<div id="app"></div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
var SUPA_URL='https://xmnmwnfmmopsxhihmyyg.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhtbm13bmZtbW9wc3hoaWhteXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTQzODIsImV4cCI6MjEwNzIzMDM4Mn0.WTwqNEdOXeauDJiBxktFQDb6N4T-N_qH-HN-nytsHHQ';
var db=supabase.createClient(SUPA_URL,SUPA_KEY);

// ── Constants ──
var PIN_CODE='1234';
var RETIRE_AT=17;   // balls before retirement
var OVER_SIZE=6;    // balls per over (all types count)
var MAX_OVERS=20;
var WKT_BONUS=4;    // bonus runs per wicket to bowling team

// Ball definitions: bat=runs off bat, extra=extra runs to total, re=batter re credit
var BD={
  '.': {bat:0,ex:0,re:0,w:0,b:0,nb:0},
  '1': {bat:1,ex:0,re:1,w:0,b:0,nb:0},
  '2': {bat:2,ex:0,re:2,w:0,b:0,nb:0},
  '3': {bat:3,ex:0,re:3,w:0,b:0,nb:0},
  '4': {bat:4,ex:0,re:4,w:0,b:0,nb:0},
  '6': {bat:6,ex:0,re:6,w:0,b:0,nb:0},
  'W': {bat:0,ex:1,re:1,w:1,b:0,nb:0},
  '2W':{bat:0,ex:3,re:3,w:3,b:0,nb:0},
  '4W':{bat:0,ex:5,re:5,w:5,b:0,nb:0},
  'B': {bat:0,ex:1,re:1,w:0,b:1,nb:0},
  '2B':{bat:0,ex:2,re:2,w:0,b:2,nb:0},
  '4B':{bat:0,ex:4,re:4,w:0,b:4,nb:0},
  'N': {bat:0,ex:0,re:0,w:0,b:0,nb:1},
};

// ── State ──
var S={
  screen:'pin',     // pin|matches|setup|scoring|endover|endinnings|done
  pin:'',
  matches:[],
  match:null,
  offline:!navigator.onLine,

  // Innings
  innNum:1,
  batTeam:'',
  bowlTeam:'',
  batOrder:[],   // batting team names
  bowlOrder:[],  // bowling team names
  batOn:'',      // on-strike batter
  batOff:'',     // non-striker
  batNextIdx:2,  // next batter from batOrder to come in
  bowler:'',
  prevBowler:'', // can't bowl consecutive overs

  // Balls array — each: {type,batter,bowler,ov,bat,re,tot,isWkt,how,wktRuns}
  balls:[],

  // Incremental totals
  total:0, wkts:0,
  exW:0, exB:0, exNB:0,

  // Per-player stats (reset per innings)
  bs:{},  // batStats: {name:{r,re,b,fs,sx,d,wkts,retired}}
  bws:{}, // bowlStats: {name:{balls,r,w}}

  // Flags
  retirePending:false,
  endOverPending:false,
  showWkt:false,
  wktType:'',
  wktRuns:0,

  // Supabase
  innId:null,
  saving:false,

  // Cross-innings
  inn1:null,  // summary after innings 1 ends

  // Setup wizard
  sz:{step:0,tossWinnerIdx:-1,tossDecision:'',batFirstIdx:-1,batTxt:'',bowlTxt:''},

  // Add match modal
  showAddMatch:false,
};

function r(){
  var scr=S.screen;
  if(scr==='pin')      rPin();
  else if(scr==='matches')  rMatches();
  else if(scr==='setup')    rSetup();
  else if(scr==='scoring')  rScoring();
  else if(scr==='endover')  rEndOver();
  else if(scr==='changebowler') rChangeBowler();
  else if(scr==='endinnings') rEndInnings();
  else if(scr==='done')     rDone();
}
function set(html){document.getElementById('app').innerHTML=html;}

// ─────────────────────────────────────────────
// PIN
// ─────────────────────────────────────────────
function rPin(){
  var dots='';
  for(var i=0;i<4;i++) dots+='<div class="pin-dot'+(i<S.pin.length?' on':'')+'"></div>';
  var keys=[1,2,3,4,5,6,7,8,9,'','0','⌫'];
  var btns=keys.map(function(k){
    return k===''?'<div></div>':
      '<button class="pk" onclick="pinKey(\''+k+'\')">'+k+'</button>';
  }).join('');
  set('<div class="hdr"><div class="hdr-title">WPC Scorer</div></div>'+
    '<div class="pin-wrap">'+
      '<div style="font-size:18px;font-weight:800;opacity:.8">Enter PIN</div>'+
      '<div class="pin-dots">'+dots+'</div>'+
      '<div class="pin-grid">'+btns+'</div>'+
      '<div style="font-size:11px;opacity:.3;margin-top:8px">Default PIN: 1234</div>'+
    '</div>');
}
function pinKey(k){
  if(k==='⌫'){S.pin=S.pin.slice(0,-1);r();return;}
  S.pin+=String(k);
  if(S.pin.length===4){
    if(S.pin===PIN_CODE){S.screen='matches';S.pin='';loadMatches();}
    else{alert('Wrong PIN');S.pin='';r();}
  } else r();
}

// ─────────────────────────────────────────────
// MATCHES
// ─────────────────────────────────────────────
function loadMatches(){
  set('<div class="hdr"><div class="hdr-title">Select Match</div><a class="hdr-hub" href="index.html">⌂ Hub</a></div>'+
    '<div class="scr"><div style="opacity:.5;text-align:center;padding:30px">Loading…</div></div>');
  db.from('matches').select('*').in('status',['upcoming','live']).order('id')
    .then(function(res){
      if(res.error){console.error(res.error);}
      S.matches=(res.data||[]).map(function(m){
        m.t1=typeof m.t1==='string'?JSON.parse(m.t1):m.t1;
        m.t2=typeof m.t2==='string'?JSON.parse(m.t2):m.t2;
        return m;
      });
      r();
    });
}
var KNOWN_TEAMS=[
  {name:'WPC Teal',    short:'TEAL',logo:'WPC', cls:'logo-wpc'},
  {name:'BSK Cubs Bronze',short:'BSK',logo:'BSK',cls:'logo-bsk'},
  {name:'WPC Yellow',  short:'YLW', logo:'WPY', cls:'logo-wpcy'},
  {name:'WPC Aqua',    short:'AQA', logo:'WPA', cls:'logo-wpa'},
  {name:'Souths Hawks',short:'SH',  logo:'SH',  cls:'logo-sh'},
];
function teamObj(name){
  return KNOWN_TEAMS.find(function(t){return t.name===name;})||
    {name:name,short:name.substring(0,3).toUpperCase(),logo:name.substring(0,3).toUpperCase(),cls:'logo-def'};
}

function rMatches(){
  var cards=S.matches.length
    ? S.matches.map(function(m){
        var live=m.status==='live';
        return '<div class="card" onclick="pickMatch('+m.id+')">'+
          '<div style="font-size:11px;font-weight:700;opacity:.6;margin-bottom:4px">ROUND '+m.round+
            (live?' &nbsp;<span class="badge-live">LIVE</span>':'')+
          ' &bull; '+m.date+'</div>'+
          '<div style="font-size:16px;font-weight:700;margin-bottom:4px">'+m.t1.name+' vs '+m.t2.name+'</div>'+
          '<div style="font-size:12px;opacity:.6">'+m.time+' &bull; '+m.venue+'</div>'+
        '</div>';
      }).join('')
    : '<div style="text-align:center;opacity:.4;padding:50px 0;font-size:14px">No upcoming matches</div>';

  var teamDatalist='<datalist id="am-teams">'+
    KNOWN_TEAMS.map(function(t){return '<option value="'+t.name+'">';}).join('')+
  '</datalist>';

  var modal=S.showAddMatch?
    '<div class="overlay" onclick="S.showAddMatch=false;r()">'+
      '<div class="mbox" onclick="event.stopPropagation()" style="gap:10px">'+
        teamDatalist+
        '<div class="mbox-title">Add Match</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          '<div><div class="lbl">Round</div><input class="inp" id="am-rnd" type="number" placeholder="5" style="padding:10px"></div>'+
          '<div><div class="lbl">Date</div><input class="inp" id="am-date" placeholder="Sat 7 Nov" style="padding:10px"></div>'+
        '</div>'+
        '<div><div class="lbl">Time</div><input class="inp" id="am-time" placeholder="8:00 AM" style="padding:10px"></div>'+
        '<div><div class="lbl">Venue</div><input class="inp" id="am-venue" placeholder="West Synthetic" style="padding:10px"></div>'+
        '<div><div class="lbl">Team 1 (pick or type new)</div><input class="inp" id="am-t1" list="am-teams" placeholder="WPC Teal" style="padding:10px"></div>'+
        '<div><div class="lbl">Team 2 (pick or type new)</div><input class="inp" id="am-t2" list="am-teams" placeholder="BSK Cubs Bronze" style="padding:10px"></div>'+
        '<div class="mbtns" style="margin-top:4px">'+
          '<button class="mbtn mbtn-no" onclick="S.showAddMatch=false;r()">Cancel</button>'+
          '<button class="mbtn mbtn-ok" onclick="saveNewMatch()">Add Match</button>'+
        '</div>'+
      '</div>'+
    '</div>'
  :'';

  set('<div class="hdr">'+
    '<span class="hdr-back" onclick="S.screen=\'pin\';S.pin=\'\';r()">←</span>'+
    '<div class="hdr-title">Select Match</div>'+
    '<a class="hdr-hub" href="index.html">⌂ Hub</a>'+
  '</div>'+
  '<div class="scr" style="padding-bottom:80px">'+cards+'</div>'+
  '<button class="fab" onclick="S.showAddMatch=true;r()">+</button>'+
  modal);
}

async function saveNewMatch(){
  var rnd=parseInt((document.getElementById('am-rnd')||{}).value||'0');
  var date=(document.getElementById('am-date')||{}).value||'';
  var time=(document.getElementById('am-time')||{}).value||'';
  var venue=(document.getElementById('am-venue')||{}).value||'';
  var t1name=(document.getElementById('am-t1')||{}).value||'';
  var t2name=(document.getElementById('am-t2')||{}).value||'';
  if(!rnd||!date||!t1name||!t2name){alert('Fill in round, date and both teams');return;}
  if(t1name===t2name){alert('Teams must be different');return;}
  var t1=teamObj(t1name), t2=teamObj(t2name);
  var datetime=''+date+' at '+time+' (local time)';
  var idRes=await db.from('matches').select('id').order('id',{ascending:false}).limit(1);
  var nextId=idRes.data&&idRes.data.length?(idRes.data[0].id+1):100;
  var res=await db.from('matches').insert({
    id:nextId,round:rnd,date:date,time:time,datetime:datetime,venue:venue||'TBC',
    grade:"MSW Stage 1 Super 7's",status:'upcoming',
    t1:t1,t2:t2,result:null
  });
  if(res.error){alert('Error: '+res.error.message);return;}
  S.showAddMatch=false;
  loadMatches();
}
async function pickMatch(id){
  S.match=S.matches.find(function(m){return m.id===id;});
  if(!S.match)return;
  // For live matches, check Supabase for a resumable innings
  if(S.match.status==='live'){
    set('<div class="hdr"><div class="hdr-title">Loading…</div></div><div class="scr" style="padding:30px;text-align:center;opacity:.5">Checking live innings…</div>');
    var res=await db.from('innings').select('*').eq('match_id',id).order('innings_num',{ascending:false}).limit(1);
    if(!res.error&&res.data&&res.data.length){
      var inn=res.data[0];
      var st=inn.scorer_state;
      if(st&&st.balls&&st.balls.length>0){
        var ballCount=st.balls.length;
        var ov=Math.floor(ballCount/6)+'.'+ballCount%6;
        if(confirm('Resume scoring from over '+ov+', score '+inn.total+'/'+inn.wkts+'?')){
          S.innId=inn.id;
          S.innNum=inn.innings_num;
          S.balls=st.balls;
          S.total=inn.total; S.wkts=inn.wkts;
          S.exW=st.exW||0; S.exB=st.exB||0; S.exNB=st.exNB||0;
          S.batOn=st.batOn; S.batOff=st.batOff;
          S.bowler=st.bowler; S.prevBowler=st.prevBowler||'';
          S.batNextIdx=st.batNextIdx||0;
          S.batOrder=st.batOrder||[]; S.bowlOrder=st.bowlOrder||[];
          S.batTeam=st.batTeam||''; S.bowlTeam=st.bowlTeam||'';
          S.bs=st.bs||{}; S.bws=st.bws||{};
          S.wktRuns=st.wktRuns||0; S.inn1=st.inn1||null;
          S.retirePending=false; S.endOverPending=false; S.showWkt=false;
          S.screen='scoring'; r(); return;
        }
      }
    }
  }
  S.sz={step:0,batFirstIdx:-1,batTxt:'',bowlTxt:''};
  S.innNum=1;
  S.screen='setup';
  r();
}

// ─────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────
function rSetup(){
  var m=S.match;
  var sz=S.sz;
  var hdr='<div class="hdr">'+
    '<span class="hdr-back" onclick="S.screen=\'matches\';r()">←</span>'+
    '<div class="hdr-title">Innings '+S.innNum+' Setup</div>'+
    '<a class="hdr-hub" href="index.html">⌂ Hub</a>'+
  '</div>';

  if(sz.step===0){
    var tossWinner=sz.tossWinnerIdx>=0?(sz.tossWinnerIdx===0?m.t1.name:m.t2.name):'';
    var decisionHtml='';
    if(sz.tossWinnerIdx>=0){
      decisionHtml=
        '<div style="font-size:15px;font-weight:700;text-align:center;margin-top:16px">'+tossWinner+' chose to…</div>'+
        '<div class="tpick">'+
          '<div class="tpick-btn'+(sz.tossDecision==='bat'?' on':'')+'" onclick="S.sz.tossDecision=\'bat\';S.sz.batFirstIdx=S.sz.tossWinnerIdx;r()">Bat</div>'+
          '<div class="tpick-btn'+(sz.tossDecision==='bowl'?' on':'')+'" onclick="S.sz.tossDecision=\'bowl\';S.sz.batFirstIdx=S.sz.tossWinnerIdx===0?1:0;r()">Bowl</div>'+
        '</div>';
    }
    set(hdr+'<div class="scr">'+
      '<div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:4px">Who won the toss?</div>'+
      '<div class="tpick">'+
        '<div class="tpick-btn'+(sz.tossWinnerIdx===0?' on':'')+'" onclick="S.sz.tossWinnerIdx=0;S.sz.tossDecision=\'\';S.sz.batFirstIdx=-1;r()">'+m.t1.name+'</div>'+
        '<div class="tpick-btn'+(sz.tossWinnerIdx===1?' on':'')+'" onclick="S.sz.tossWinnerIdx=1;S.sz.tossDecision=\'\';S.sz.batFirstIdx=-1;r()">'+m.t2.name+'</div>'+
      '</div>'+
      decisionHtml+
      (sz.batFirstIdx>=0?'<button class="btn btn-gold" onclick="S.sz.step=1;r()">Next →</button>':'')+
    '</div>');

  } else if(sz.step===1){
    var bt=sz.batFirstIdx===0?m.t1.name:m.t2.name;
    var blt=sz.batFirstIdx===0?m.t2.name:m.t1.name;
    set(hdr+'<div class="scr">'+
      '<div>'+
        '<div class="lbl">'+bt+' — Batting Order (one name per line)</div>'+
        '<textarea class="inp" id="bat-txt" rows="8" placeholder="Tom\nSerhan\nAksharan\n...">'+sz.batTxt+'</textarea>'+
      '</div>'+
      '<div>'+
        '<div class="lbl">'+blt+' — Bowling Order (one per line)</div>'+
        '<textarea class="inp" id="bowl-txt" rows="8" placeholder="Player1\nPlayer2\n...">'+sz.bowlTxt+'</textarea>'+
      '</div>'+
      '<button class="btn btn-gold" onclick="setupSaveOrders()">Next →</button>'+
    '</div>');

  } else if(sz.step===2){
    var batList=sz.batTxt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    var bowlList=sz.bowlTxt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    var batOpts=batList.map(function(n){return '<option>'+n+'</option>';}).join('');
    var bowlOpts=bowlList.map(function(n){return '<option>'+n+'</option>';}).join('');
    set(hdr+'<div class="scr">'+
      '<div><div class="lbl">Batter on Strike</div><select class="inp" id="s-on" onchange="syncBatterSelects()">'+batOpts+'</select></div>'+
      '<div><div class="lbl">Non-Striker</div><select class="inp" id="s-off" onchange="syncBatterSelects()">'+batOpts+'</select></div>'+
      '<div><div class="lbl">Opening Bowler</div><select class="inp" id="s-bowl">'+bowlOpts+'</select></div>'+
      '<button class="btn btn-gold" onclick="startInnings()">🏏 Start Innings '+S.innNum+'</button>'+
    '</div>');

}
function setupSaveOrders(){
  var bt=(document.getElementById('bat-txt')||{}).value||'';
  var bl=(document.getElementById('bowl-txt')||{}).value||'';
  S.sz.batTxt=bt;S.sz.bowlTxt=bl;
  var batList=bt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var bowlList=bl.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  if(batList.length<2){alert('Enter at least 2 batters');return;}
  if(bowlList.length<1){alert('Enter at least 1 bowler');return;}
  S.sz.step=2;r();
}
function syncBatterSelects(){
  var on=document.getElementById('s-on');
  var off=document.getElementById('s-off');
  if(!on||!off)return;
  // Re-enable all options in non-striker only
  Array.from(off.options).forEach(function(o){o.disabled=false;});
  // Disable the current striker's name in the non-striker list
  var strikerVal=on.value;
  Array.from(off.options).forEach(function(o){
    if(o.value===strikerVal||o.text===strikerVal)o.disabled=true;
  });
  // If non-striker is currently the same as striker, jump to first available
  if(off.value===strikerVal){
    for(var i=0;i<off.options.length;i++){
      if(!off.options[i].disabled){off.selectedIndex=i;break;}
    }
  }
}
async function startInnings(){
  var sz=S.sz;
  var batList=sz.batTxt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var bowlList=sz.bowlTxt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var batOn=(document.getElementById('s-on')||{}).value||batList[0];
  var batOff=(document.getElementById('s-off')||{}).value||batList[1];
  var bowler=(document.getElementById('s-bowl')||{}).value||bowlList[0];
  if(batOn===batOff){alert('Batters must be different');return;}

  var batTeam=sz.batFirstIdx===0?S.match.t1.name:S.match.t2.name;
  var bowlTeam=sz.batFirstIdx===0?S.match.t2.name:S.match.t1.name;

  S.batTeam=batTeam; S.bowlTeam=bowlTeam;
  S.batOrder=batList; S.bowlOrder=bowlList;
  S.batOn=batOn; S.batOff=batOff; S.bowler=bowler; S.prevBowler='';

  // Find next batter index
  var usedSet={};usedSet[batOn]=true;usedSet[batOff]=true;
  S.batNextIdx=batList.findIndex(function(n){return !usedSet[n];});
  if(S.batNextIdx<0)S.batNextIdx=batList.length;

  S.balls=[]; S.total=0; S.wkts=0; S.exW=0; S.exB=0; S.exNB=0;
  S.retirePending=false; S.endOverPending=false; S.showWkt=false;

  S.bs={}; S.bws={};
  batList.forEach(function(n){S.bs[n]={r:0,re:0,b:0,fs:0,sx:0,d:'',wkts:0,retired:false};});
  bowlList.forEach(function(n){S.bws[n]={balls:0,r:0,w:0};});

  // Update match to live
  await queueMatchUpdate({status:'live'});

  // Create innings row
  var res=await db.from('innings').insert({
    match_id:S.match.id,innings_num:S.innNum,
    bat:batTeam,bowl:bowlTeam,
    total:0,wkts:0,overs:'0.0',
    extras:{w:0,b:0,lb:0,nb:0,tot:0},bonus:0,
    batters:batList.map(function(n){return {n:n,r:0,re:0,b:0,fs:0,sx:0,d:''};}),
    bowlers:bowlList.map(function(n){return {n:n,o:'0.0',r:0,w:0,ec:0};}),
    scorer_state:null
  }).select().single();
  if(res.error){console.error('innings insert',res.error);}
  else S.innId=res.data.id;

  S.screen='scoring';r();
}

// ─────────────────────────────────────────────
// SCORING
// ─────────────────────────────────────────────
function oversStr(balls){
  return Math.floor(balls/OVER_SIZE)+'.'+balls%OVER_SIZE;
}
function currentOverBalls(){
  var ov=Math.floor(S.balls.length/OVER_SIZE);
  return S.balls.filter(function(b){return b.ov===ov;});
}

function rScoring(){
  if(S.endOverPending){rEndOver();return;}

  var bs=S.bs[S.batOn]||{r:0,re:0,b:0};
  var bsOff=S.bs[S.batOff]||{r:0,re:0,b:0};
  var bws=S.bws[S.bowler]||{balls:0,r:0,w:0};
  var bowOv=oversStr(bws.balls);
  var bonus=S.wkts*WKT_BONUS;
  var totalBalls=S.balls.length;
  var inningsDone=totalBalls>=MAX_OVERS*OVER_SIZE;

  var ovBalls=currentOverBalls();
  var dots=ovBalls.map(function(b){
    var lbl=b.type==='.'?'·':b.type;
    if(b.isWkt)lbl+='‼';
    var cls='od'+(b.isWkt?' od-wkt':(b.type!=='.'&&b.type!=='1'&&b.type!=='2'&&b.type!=='3'&&b.type!=='4'&&b.type!=='6'?' od-extra':''));
    return '<span class="'+cls+'">'+lbl+'</span>';
  }).join('');

  var target=S.inn1?'<div class="starget">Target: '+(S.inn1.total+S.inn1.bonus+1)+'</div>':'';

  var wktModal='';
  if(S.showWkt){
    var isRetire=S.wktType==='Retire';
    var howOpts=['Bowled','Caught','C&B','Run Out','Stumped','Hit Wkt'].map(function(t){
      return '<div class="mopt'+(S.wktType===t?' on':'')+'" onclick="S.wktType=\''+t+'\';r()">'+t+'</div>';
    }).join('');
    var runOpts=[0,1,2].map(function(n){
      return '<div class="mopt'+(S.wktRuns===n?' on':'')+'" onclick="S.wktRuns='+n+';r()">'+n+'</div>';
    }).join('');
    wktModal='<div class="overlay" onclick="S.showWkt=false;r()">'+
      '<div class="mbox" onclick="event.stopPropagation()">'+
        '<div class="mbox-title">Wicket / Dismissal</div>'+
        '<div class="lbl" style="margin-bottom:5px">How out?</div>'+
        '<div class="mgrid">'+howOpts+'</div>'+
        // Retire option — separate from dismissals, no wicket counted
        '<div class="mopt" style="margin-top:6px;background:'+(isRetire?'#f5a623':'rgba(255,255,255,.1)')+';color:'+(isRetire?'#1a5e36':'#fff')+'" onclick="S.wktType=\'Retire\';r()">Retire Batter (no wicket)</div>'+
        (!isRetire?
          '<div class="lbl" style="margin:10px 0 5px">Runs on this ball</div>'+
          '<div class="mrow4">'+runOpts+
            '<div class="mopt'+(S.wktRuns===3?' on':'')+'" onclick="S.wktRuns=3;r()">3</div>'+
          '</div>'
        :
          '<div style="opacity:.5;font-size:12px;margin:8px 0">Batter stands down — no ball bowled, no wicket, no bonus.</div>'
        )+
        '<div class="mbtns">'+
          '<button class="mbtn mbtn-no" onclick="S.showWkt=false;r()">Cancel</button>'+
          '<button class="mbtn mbtn-ok" onclick="S.wktType===\'Retire\'?confirmRetire():confirmWkt()">Record</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  var ballBtns=inningsDone?
    '<button class="btn btn-gold" onclick="endInnings()">End Innings '+S.innNum+'</button>'
    :
    (S.retirePending?
      '<div class="retire-bar" onclick="doRetire()">'+S.batOn+' retired ('+RETIRE_AT+' balls) — tap to bring next batter in</div>'
    :
    '<div class="bgrid">'+
      '<button class="bb bb-dot" onclick="ball(\'.\')">·</button>'+
      '<button class="bb bb-run" onclick="ball(\'1\')">1</button>'+
      '<button class="bb bb-run" onclick="ball(\'2\')">2</button>'+
      '<button class="bb bb-run" onclick="ball(\'3\')">3</button>'+
      '<button class="bb bb-4"  onclick="ball(\'4\')">4</button>'+
      '<button class="bb bb-6"  onclick="ball(\'6\')">6</button>'+
      '<button class="bb bb-wide" onclick="ball(\'W\')">W</button>'+
      '<button class="bb bb-wide" onclick="ball(\'2W\')">2W</button>'+
      '<button class="bb bb-wide" onclick="ball(\'4W\')">4W</button>'+
      '<button class="bb bb-bye" onclick="ball(\'B\')">B</button>'+
      '<button class="bb bb-bye" onclick="ball(\'2B\')">2B</button>'+
      '<button class="bb bb-bye" onclick="ball(\'4B\')">4B</button>'+
      '<button class="bb bb-nb"  onclick="ball(\'N\')">NB</button>'+
      '<div></div>'+
      '<button class="bb bb-wkt" onclick="S.showWkt=true;S.wktType=\'\';S.wktRuns=0;r()">WICKET ‼</button>'+
      '<button class="bb bb-undo" onclick="undoBall()">↩ UNDO</button>'+
    '</div>'
    );

  set('<div class="hdr">'+
    '<span class="hdr-back" onclick="if(confirm(\'Leave scoring? Progress is saved.\'))backToMatches()">←</span>'+
    '<div class="hdr-title">'+S.batTeam+' batting</div>'+
    '<span class="hdr-save" style="'+(S.offline?'color:#ff7070':'')+'">'+
      (S.saving?'saving…':S.offline?'● offline':'')+
    '</span>'+
    '<a class="hdr-hub" href="index.html" onclick="return confirm(\'Go to Hub? Scoring progress is saved.\')">⌂ Hub</a>'+
  '</div>'+
  '<div class="scr">'+
    '<div class="sbanner">'+
      '<div class="stotal">'+S.total+'/'+S.wkts+'</div>'+
      '<div class="sover">'+oversStr(totalBalls)+' ovs &bull; Bonus for opp: +'+bonus+'</div>'+
      target+
    '</div>'+
    '<div style="font-size:10px;font-weight:800;letter-spacing:.5px;opacity:.5;text-align:center">THIS OVER</div>'+
    '<div class="over-dots">'+(dots||'<span style="opacity:.25">· · · · · ·</span>')+'</div>'+
    '<div class="batrow">'+
      '<div class="bat bat-strike">'+
        '<div class="bat-name">'+S.batOn+'</div>'+
        '<div class="bat-stat">'+bs.r+'('+bs.b+'b) +E:'+bs.re+'</div>'+
      '</div>'+
      '<button class="swap-btn" onclick="swapBat()">SWAP ⇄</button>'+
      '<div class="bat">'+
        '<div class="bat-name">'+S.batOff+'</div>'+
        '<div class="bat-stat">'+bsOff.r+'('+bsOff.b+'b) +E:'+bsOff.re+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="bowrow">'+
      '<span class="bow-name">'+S.bowler+'</span>'+
      '<span class="bow-stat">'+bowOv+' ov &bull; '+bws.r+'r &bull; '+bws.w+'w</span>'+
      (ovBalls.length===0?'<button class="btn" style="font-size:11px;padding:4px 10px;background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;cursor:pointer;margin-left:6px" onclick="S.screen=\'changebowler\';r()">Change</button>':'')+
    '</div>'+
    ballBtns+
    (!inningsDone&&!S.retirePending?
      '<button class="btn btn-dim" style="margin-top:4px" onclick="if(confirm(\'End innings early?\'))endInnings()">End Innings</button>':'')+
  '</div>'+
  wktModal);
}

function ball(type){
  if(S.retirePending||S.endOverPending)return;
  var bd=BD[type];if(!bd)return;
  var ov=Math.floor(S.balls.length/OVER_SIZE);
  var b={type:type,batter:S.batOn,bowler:S.bowler,ov:ov,
         bat:bd.bat,re:bd.re,tot:bd.bat+bd.ex,isWkt:false,how:'',wktRuns:0};
  S.balls.push(b);
  applyBall(b,1);
  checkAfterBall();
  saveToDB(r);
}

function applyBall(b,sign){
  var bat=BD[b.type]||{bat:0,ex:0,re:0,w:0,nb:0,byes:0};
  S.total+=sign*b.tot;
  S.exW+=sign*(BD[b.type]||{w:0}).w;
  S.exB+=sign*(BD[b.type]||{b:0}).b;
  S.exNB+=sign*(BD[b.type]||{nb:0}).nb;
  if(b.isWkt)S.wkts+=sign;

  var bs=S.bs[b.batter];
  if(bs){
    bs.b+=sign;
    bs.r+=sign*b.bat;
    bs.re+=sign*b.re;
    if(b.bat===4)bs.fs+=sign;
    if(b.bat===6)bs.sx+=sign;
    if(b.isWkt){
      bs.wkts+=sign;
      if(sign>0&&b.how&&!bs.d)bs.d=b.how;
    }
  }
  var bw=S.bws[b.bowler];
  if(bw){
    bw.balls+=sign;
    bw.r+=sign*(b.tot+(b.isWkt?0:0)); // tot already includes extras
    if(b.isWkt)bw.w+=sign;
  }

  // Strike rotation on odd bat runs
  if(b.bat%2===1&&sign>0){var tmp=S.batOn;S.batOn=S.batOff;S.batOff=tmp;}
  if(b.bat%2===1&&sign<0){var tmp2=S.batOn;S.batOn=S.batOff;S.batOff=tmp2;}
}

function checkAfterBall(){
  var totalBalls=S.balls.length;
  // Check retire
  var bs=S.bs[S.batOn];
  if(bs&&bs.b>=RETIRE_AT&&!bs.retired&&!bs.recalled){
    bs.retired=true;
    if(!bs.d)bs.d='retired';
    S.retirePending=true;
  }
  // Check end of over
  if(totalBalls%OVER_SIZE===0){
    S.endOverPending=true;
  }
  // Check innings done
  if(totalBalls>=MAX_OVERS*OVER_SIZE){
    S.endOverPending=false;
  }
}

function confirmWkt(){
  var ov=Math.floor(S.balls.length/OVER_SIZE);
  var b={type:'.',batter:S.batOn,bowler:S.bowler,ov:ov,
         bat:S.wktRuns,re:S.wktRuns,tot:S.wktRuns,
         isWkt:true,how:S.wktType||'out',wktRuns:S.wktRuns};
  S.balls.push(b);
  S.total+=S.wktRuns;
  S.wkts++;
  var bs=S.bs[S.batOn];
  if(bs){
    bs.b++;bs.r+=S.wktRuns;bs.re+=S.wktRuns;bs.wkts++;
    bs.d=S.wktType||'out';
  }
  var bw=S.bws[S.bowler];
  if(bw){bw.balls++;bw.r+=S.wktRuns;bw.w++;}
  // Always swap striker on wicket; scorer can tap SWAP ⇄ to correct edge cases
  var tmp=S.batOn;S.batOn=S.batOff;S.batOff=tmp;
  S.showWkt=false;
  checkAfterBall();
  saveToDB(r);
}

function confirmRetire(){
  // Retire current batter — no wicket, no bonus, no ball consumed
  S.showWkt=false;
  var bs=S.bs[S.batOn];
  if(bs){bs.retired=true;if(!bs.d)bs.d='retired';}
  S.retirePending=false;
  // Bring in next non-retired batter
  var idx=S.batNextIdx;
  while(idx<S.batOrder.length){
    var n=S.batOrder[idx];
    if(S.bs[n]&&!S.bs[n].retired){break;}
    idx++;
  }
  if(idx<S.batOrder.length){
    S.batOn=S.batOrder[idx];
    S.batNextIdx=idx+1;
  } else {
    var recalled=recallBatter();
    if(recalled){S.batOn=recalled;}
    else{endInnings();return;}
  }
  saveToDB(r);
}

function undoBall(){
  if(!S.balls.length)return;
  S.retirePending=false;S.endOverPending=false;
  var b=S.balls.pop();
  applyBall(b,-1);
  // applyBall handles odd-run strike rotation; for even-run wickets we need to undo the unconditional wicket swap
  if(b.isWkt&&b.bat%2===0){var tw=S.batOn;S.batOn=S.batOff;S.batOff=tw;}
  // Fix retired flag
  var bs=S.bs[b.batter];
  if(bs&&bs.b<RETIRE_AT)bs.retired=false;
  if(bs&&bs.wkts<1&&bs.d&&bs.d!=='retired')bs.d='';
  saveToDB(r);
}

function swapBat(){var tmp=S.batOn;S.batOn=S.batOff;S.batOff=tmp;r();}

function recallBatter(){
  // When no fresh batter available, recall the earliest retired (not dismissed) batter
  for(var ri=0;ri<S.batOrder.length;ri++){
    var rn=S.batOrder[ri];
    if(S.bs[rn]&&S.bs[rn].retired&&!S.bs[rn].recalled&&rn!==S.batOff){
      S.bs[rn].retired=false;
      S.bs[rn].recalled=true;
      return rn;
    }
  }
  return null;
}

function doRetire(){
  S.retirePending=false;
  var idx=S.batNextIdx;
  while(idx<S.batOrder.length){
    var n=S.batOrder[idx];
    if(S.bs[n]&&!S.bs[n].retired){break;}
    idx++;
  }
  if(idx<S.batOrder.length){
    S.batOn=S.batOrder[idx];
    S.batNextIdx=idx+1;
  } else {
    var recalled=recallBatter();
    if(recalled){S.batOn=recalled;}
    else{endInnings();return;}
  }
  r();
}

function backToMatches(){S.screen='matches';r();}

// ─────────────────────────────────────────────
// END OF OVER
// ─────────────────────────────────────────────
function rEndOver(){
  var ovNum=Math.floor(S.balls.length/OVER_SIZE);
  var ovBalls=S.balls.filter(function(b){return b.ov===ovNum-1;});
  var ovRuns=ovBalls.reduce(function(s,b){return s+b.tot;},0);

  var opts=S.bowlOrder.map(function(n){
    var bw=S.bws[n]||{balls:0,r:0,w:0};
    var ovsUsed=Math.floor(bw.balls/OVER_SIZE);
    var dis=ovsUsed>=4||n===S.bowler;
    return '<div class="bow-opt'+(dis?' dis':'')+'" onclick="pickBowler(\''+n+'\')">'+
      '<span style="font-weight:700;font-size:15px">'+n+'</span>'+
      '<span style="font-size:12px;opacity:.6">'+ovsUsed+'/4 overs</span>'+
    '</div>';
  }).join('');

  set('<div class="hdr"><div class="hdr-title">Over '+ovNum+' complete</div><a class="hdr-hub" href="index.html" onclick="return confirm(\'Go to Hub?\')">⌂ Hub</a></div>'+
    '<div class="scr">'+
      '<div class="sbanner">'+
        '<div class="stotal">'+S.total+'/'+S.wkts+'</div>'+
        '<div class="sover">'+oversStr(S.balls.length)+' ovs &bull; Over ran: '+ovRuns+'</div>'+
      '</div>'+
      '<div style="font-size:15px;font-weight:800">Select bowler for over '+(ovNum+1)+'</div>'+
      opts+
    '</div>');
}
function pickBowler(name){
  S.prevBowler=S.bowler;
  S.bowler=name;
  S.endOverPending=false;
  // Swap ends at end of over
  var tmp=S.batOn;S.batOn=S.batOff;S.batOff=tmp;
  S.screen='scoring';r();
}

function rChangeBowler(){
  var ovNum=Math.floor(S.balls.length/OVER_SIZE);
  var opts=S.bowlOrder.map(function(n){
    var bw=S.bws[n]||{balls:0,r:0,w:0};
    var ovsUsed=Math.floor(bw.balls/OVER_SIZE);
    var dis=ovsUsed>=4;
    return '<div class="bow-opt'+(dis?' dis':'')+'" onclick="setNewBowler(\''+n+'\')">'+
      '<span style="font-weight:700;font-size:15px">'+n+(n===S.bowler?' ✓':' ')+'</span>'+
      '<span style="font-size:12px;opacity:.6">'+ovsUsed+'/4 overs</span>'+
    '</div>';
  }).join('');
  set('<div class="hdr">'+
    '<span class="hdr-back" onclick="S.screen=\'scoring\';r()">←</span>'+
    '<div class="hdr-title">Change Bowler — Over '+(ovNum+1)+'</div>'+
  '</div>'+
  '<div class="scr">'+
    '<div style="font-size:13px;opacity:.6;text-align:center">No balls bowled yet — select new bowler</div>'+
    opts+
  '</div>');
}
function setNewBowler(name){
  S.prevBowler=S.bowler;
  S.bowler=name;
  S.screen='scoring';r();
}

// ─────────────────────────────────────────────
// END INNINGS
// ─────────────────────────────────────────────
function endInnings(){
  S.endOverPending=false;
  var bonus=S.wkts*WKT_BONUS;
  saveToDB(function(){
    if(S.innNum===1){
      S.inn1={
        bat:S.batTeam,bowl:S.bowlTeam,
        total:S.total,wkts:S.wkts,bonus:bonus,
        overs:oversStr(S.balls.length)
      };
      S.screen='endinnings';r();
    } else {
      finalizeMatch();
    }
  });
}

function rEndInnings(){
  var inn=S.inn1;
  var bonus=inn.bonus;
  set('<div class="hdr"><div class="hdr-title">Innings 1 Complete</div><a class="hdr-hub" href="index.html" onclick="return confirm(\'Go to Hub?\')">⌂ Hub</a></div>'+
    '<div class="scr">'+
      '<div class="sbanner">'+
        '<div class="stotal">'+inn.total+'/'+inn.wkts+'</div>'+
        '<div class="sover">'+inn.overs+' overs &bull; Bonus +'+bonus+' to '+inn.bowl+'</div>'+
      '</div>'+
      '<div class="sum-row"><span>'+inn.bat+' score</span><span style="font-weight:800">'+inn.total+' + '+bonus+' = '+(inn.total+bonus)+'</span></div>'+
      '<div class="sum-row"><span>'+inn.bowl+' need</span><span style="font-weight:800;color:#f5a623">'+(inn.total+bonus+1)+' to win</span></div>'+
      '<button class="btn btn-gold" onclick="startInn2()">Start Innings 2 →</button>'+
    '</div>');
}

function startInn2(){
  S.innNum=2;
  // Swap teams
  var tmp=S.batTeam;S.batTeam=S.bowlTeam;S.bowlTeam=tmp;
  // Reset innings state
  S.balls=[];S.total=0;S.wkts=0;S.exW=0;S.exB=0;S.exNB=0;
  S.retirePending=false;S.endOverPending=false;S.showWkt=false;
  S.innId=null;
  // Swap setup so new bat team's order goes in
  var prevSz=S.sz;
  S.sz={step:1,batFirstIdx:1-prevSz.batFirstIdx,batTxt:'',bowlTxt:''};
  S.screen='setup';r();
}

// ─────────────────────────────────────────────
// FINALIZE MATCH
// ─────────────────────────────────────────────
async function finalizeMatch(){
  var bonus=S.wkts*WKT_BONUS;
  var inn1=S.inn1;
  var inn2Score=S.total+bonus;
  var inn1Score=inn1.total+inn1.bonus;
  var winner=inn2Score>inn1Score?S.batTeam:inn1.bat;
  var result=winner+' won ('+Math.max(inn1Score,inn2Score)+' vs '+Math.min(inn1Score,inn2Score)+')';

  await queueMatchUpdate({status:'completed',result:result});
  S.inn2Summary={total:S.total,wkts:S.wkts,bonus:bonus,score:inn2Score};
  S.screen='done';r();
}

function rDone(){
  var inn1=S.inn1;
  var inn2=S.inn2Summary||{total:S.total,wkts:S.wkts,bonus:S.wkts*WKT_BONUS,score:S.total+S.wkts*WKT_BONUS};
  var winner=inn2.score>inn1.total+inn1.bonus?S.batTeam:inn1.bat;
  set('<div class="hdr"><div class="hdr-title">Match Complete</div><a class="hdr-hub" href="index.html">⌂ Hub</a></div>'+
    '<div class="scr">'+
      '<div class="sbanner" style="background:#c17f00">'+
        '<div style="font-size:22px;font-weight:900">'+winner+' won!</div>'+
        '<div style="margin-top:8px;opacity:.9">'+inn1.bat+': '+inn1.total+'/'+inn1.wkts+' (+'+inn1.bonus+') = '+(inn1.total+inn1.bonus)+'</div>'+
        '<div style="opacity:.9">'+S.batTeam+': '+inn2.total+'/'+inn2.wkts+' (+'+inn2.bonus+') = '+inn2.score+'</div>'+
      '</div>'+
      '<div style="text-align:center;padding:20px;opacity:.5;font-size:13px">Full scorecard now live in the hub</div>'+
      '<button class="btn btn-dim" onclick="S.screen=\'matches\';loadMatches()">← Back to Matches</button>'+
    '</div>');
}

// ─────────────────────────────────────────────
// SUPABASE SAVE
// ─────────────────────────────────────────────
function buildBatters(){
  return S.batOrder.map(function(n){
    var bs=S.bs[n]||{r:0,re:0,b:0,fs:0,sx:0,d:''};
    return {n:n,r:bs.r,re:bs.re,b:bs.b,fs:bs.fs,sx:bs.sx,d:bs.d||''};
  });
}
function buildBowlers(){
  return S.bowlOrder.map(function(n){
    var bw=S.bws[n]||{balls:0,r:0,w:0};
    var ov=oversStr(bw.balls);
    var ec=bw.balls>0?(bw.r/(bw.balls/OVER_SIZE)).toFixed(1):'0.0';
    return {n:n,o:ov,r:bw.r,w:bw.w,ec:parseFloat(ec)};
  });
}
function saveToDB(cb){
  if(!S.innId){if(cb)cb();return;}
  S.saving=true;
  var extras={w:S.exW,b:S.exB,lb:0,nb:S.exNB,tot:S.exW+S.exB+S.exNB};
  var payload={
    total:S.total,wkts:S.wkts,overs:oversStr(S.balls.length),
    extras:extras,bonus:S.wkts*WKT_BONUS,
    batters:buildBatters(),
    bowlers:buildBowlers(),
    scorer_state:{
      batOn:S.batOn,batOff:S.batOff,bowler:S.bowler,prevBowler:S.prevBowler,
      batNextIdx:S.batNextIdx,balls:S.balls,
      batOrder:S.batOrder,bowlOrder:S.bowlOrder,
      bs:S.bs,bws:S.bws,
      exW:S.exW,exB:S.exB,exNB:S.exNB,
      wktRuns:S.wktRuns,innNum:S.innNum,
      batTeam:S.batTeam,bowlTeam:S.bowlTeam,
      inn1:S.inn1
    }
  };
  // Always persist locally so we can recover after network loss
  try{localStorage.setItem('wpc-inn-q',JSON.stringify({innId:S.innId,payload:payload}));}catch(e){}
  if(!navigator.onLine){
    S.saving=false; S.offline=true; r(); if(cb)cb(); return;
  }
  db.from('innings').update(payload).eq('id',S.innId).then(function(res){
    S.saving=false;
    if(res.error){console.error('save error',res.error);}
    else{try{localStorage.removeItem('wpc-inn-q');}catch(e){}}
    if(cb)cb();
  });
}

// ─── Offline queue drain ───────────────────────
async function drainQueue(){
  S.offline=false;
  // Innings pending
  try{
    var iq=JSON.parse(localStorage.getItem('wpc-inn-q')||'null');
    if(iq){
      var res=await db.from('innings').update(iq.payload).eq('id',iq.innId);
      if(!res.error)localStorage.removeItem('wpc-inn-q');
    }
  }catch(e){}
  // Match status pending
  try{
    var mq=JSON.parse(localStorage.getItem('wpc-match-q')||'[]');
    var rem=[];
    for(var i=0;i<mq.length;i++){
      var res2=await db.from('matches').update(mq[i].payload).eq('id',mq[i].matchId);
      if(res2.error)rem.push(mq[i]);
    }
    localStorage.setItem('wpc-match-q',JSON.stringify(rem));
  }catch(e){}
  r();
}
window.addEventListener('online',drainQueue);
window.addEventListener('offline',function(){S.offline=true;r();});

async function queueMatchUpdate(payload){
  if(navigator.onLine){
    var res=await db.from('matches').update(payload).eq('id',S.match.id);
    if(!res.error)return;
  }
  try{
    var q=JSON.parse(localStorage.getItem('wpc-match-q')||'[]');
    // Replace any existing update for same matchId+status
    q=q.filter(function(x){return !(x.matchId===S.match.id&&x.payload.status===payload.status);});
    q.push({matchId:S.match.id,payload:payload});
    localStorage.setItem('wpc-match-q',JSON.stringify(q));
  }catch(e){}
}

// Keyboard PIN entry
document.addEventListener('keydown',function(e){
  if(S.screen!=='pin')return;
  if(e.key>='0'&&e.key<='9'){e.preventDefault();pinKey(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();pinKey('⌫');}
});

// Warn on refresh/close during active scoring
var SCORING_SCREENS=['scoring','endover','changebowler','endinnings'];
window.addEventListener('beforeunload',function(e){
  if(SCORING_SCREENS.indexOf(S.screen)>=0){
    e.preventDefault();
    e.returnValue='';
  }
});

r();
</script>
